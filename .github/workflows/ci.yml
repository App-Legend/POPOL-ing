name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  # OS 와 상관없는 검사와, 리눅스용 Docker 가 필요한 compose 테스트만 여기서 한다.
  check:
    name: import 규칙 · 분석 · Docker 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: import 규칙 검사
        run: .github/scripts/check-imports.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # 맨 위 폴더 중 pubspec.yaml 이 있는 패키지를 모두 검사한다. 새 기능 폴더도 자동으로 들어온다.
      - name: 패키지별 analyze
        run: |
          for pub in */pubspec.yaml; do
            dir=${pub%/pubspec.yaml}
            echo "::group::$dir"
            (cd "$dir" && flutter pub get && flutter analyze)
            echo "::endgroup::"
          done
      - name: compose 테스트
        working-directory: compose
        run: flutter test

  # 지원하는 OS 에서 테스트하고 앱을 만든다.
  test-build:
    name: ${{ matrix.target }} 테스트 · 빌드
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # 한 패키지가 실패해도 끝까지 돌려 실패를 한 번에 보여 준다.
      - name: 패키지별 test
        run: |
          failed=
          for pub in */pubspec.yaml; do
            dir=${pub%/pubspec.yaml}
            [ "$dir" != compose ] && [ -d "$dir/test" ] || continue
            echo "::group::$dir"
            (cd "$dir" && flutter pub get && flutter test) || failed="$failed $dir"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::테스트 실패:$failed"; exit 1; }
      # 테스트가 실패해도 빌드 결과는 따로 본다.
      - name: 빌드
        if: ${{ !cancelled() }}
        working-directory: app
        run: |
          flutter pub get
          flutter build ${{ matrix.target }} --debug
